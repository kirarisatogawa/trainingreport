<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジョブトレ 本日のふりかえりシート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #faf8f3;
    --accent: #c8602a;
    --accent-light: #e8956d;
    --muted: #8a8070;
    --line: #d4cfc4;
    --highlight: #fff3e8;
    --green: #3a7d5c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    padding: 48px 20px 80px;
    background-image:
      radial-gradient(circle at 90% 10%, rgba(200, 96, 42, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 10% 80%, rgba(58, 125, 92, 0.05) 0%, transparent 50%);
  }

  .page-wrap { max-width: 680px; margin: 0 auto; }
  .header { margin-bottom: 48px; animation: fadeDown 0.6s ease both; }

  .label-tag {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 12px;
  }
  h1 span { color: var(--accent); }

  .header-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.8;
    border-left: 3px solid var(--accent-light);
    padding-left: 14px;
  }

  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--highlight);
    border: 1px solid #e8c8a0;
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 24px;
  }

  .section {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .section:focus-within::before { opacity: 1; }
  .section:nth-child(1) { animation-delay: 0.05s; }
  .section:nth-child(2) { animation-delay: 0.10s; }
  .section:nth-child(3) { animation-delay: 0.15s; }
  .section:nth-child(4) { animation-delay: 0.20s; }
  .section:nth-child(5) { animation-delay: 0.25s; }
  .section:nth-child(6) { animation-delay: 0.30s; }
  .section:nth-child(7) { animation-delay: 0.35s; }
  .section:nth-child(8) { animation-delay: 0.40s; }

  .section-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 20px;
  }

  .section-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .icon-orange { background: #fff0e8; }
  .icon-green  { background: #e8f5ee; }
  .icon-blue   { background: #e8f0ff; }
  .icon-yellow { background: #fffbe8; }
  .icon-pink   { background: #ffe8f0; }
  .icon-teal   { background: #e8f5f5; }

  .section-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .section-hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .section-note {

    color: var(--muted);
